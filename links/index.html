<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small collection of apps and projects from w5y."
    />
    <meta name="theme-color" content="#06152f" />
    <title>w5y — Links</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f9f3e8;
        --muted: #b8c1d3;
        --night: #06152f;
        --night-deep: #020914;
        --line: rgba(214, 228, 255, 0.17);
        --blue: #729cff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 87% 9%, rgba(80, 131, 255, 0.25), transparent 23rem),
          radial-gradient(circle at 12% 93%, rgba(50, 99, 199, 0.17), transparent 23rem),
          var(--night-deep);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial,
          sans-serif;
      }

      .page {
        width: min(calc(100% - 40px), 600px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 76px 0 42px;
        display: flex;
        flex-direction: column;
      }

      .intro {
        text-align: center;
        animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .monogram {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(7, 24, 54, 0.64);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 3.35rem);
        line-height: 0.98;
        letter-spacing: -0.065em;
      }

      .intro p {
        max-width: 310px;
        margin: 17px auto 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .links {
        display: grid;
        gap: 14px;
        margin-top: 54px;
      }

      .app-link {
        position: relative;
        display: grid;
        grid-template-columns: 72px 1fr auto;
        align-items: center;
        gap: 18px;
        min-height: 106px;
        padding: 16px 18px 16px 16px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 25px;
        background: linear-gradient(118deg, rgba(14, 39, 81, 0.93), rgba(7, 19, 43, 0.86));
        box-shadow: 0 20px 46px rgba(0, 0, 0, 0.22);
        color: inherit;
        text-decoration: none;
        transition: transform 180ms ease, border-color 180ms ease,
          box-shadow 180ms ease;
        animation: rise 600ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .app-link::after {
        position: absolute;
        top: -82px;
        right: -54px;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: rgba(109, 157, 255, 0.12);
        content: "";
        pointer-events: none;
        transition: transform 220ms ease;
      }

      .app-link:hover {
        transform: translateY(-3px);
        border-color: rgba(182, 207, 255, 0.48);
        box-shadow: 0 26px 55px rgba(0, 0, 0, 0.32);
      }

      .app-link:hover::after {
        transform: scale(1.14);
      }

      .app-link:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }

      .app-icon {
        position: relative;
        z-index: 1;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
      }

      .app-copy {
        position: relative;
        z-index: 1;
        min-width: 0;
      }

      .app-copy h2 {
        margin: 0;
        font-size: 1.18rem;
        letter-spacing: -0.025em;
      }

      .app-copy p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .arrow {
        position: relative;
        z-index: 1;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(214, 228, 255, 0.26);
        border-radius: 50%;
        color: var(--ink);
        font-size: 1.15rem;
        line-height: 1;
        transition: transform 180ms ease, background-color 180ms ease;
      }

      .app-link:hover .arrow {
        transform: translate(2px, -2px);
        background: rgba(255, 255, 255, 0.09);
      }

      footer {
        margin-top: auto;
        padding-top: 64px;
        color: rgba(184, 193, 211, 0.68);
        font-size: 0.78rem;
        letter-spacing: 0.035em;
        text-align: center;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 440px) {
        .page {
          width: min(calc(100% - 32px), 600px);
          padding-top: 48px;
        }

        .links {
          margin-top: 42px;
        }

        .app-link {
          grid-template-columns: 62px 1fr auto;
          gap: 14px;
          min-height: 96px;
          border-radius: 22px;
        }

        .app-icon {
          width: 62px;
          height: 62px;
          border-radius: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div class="monogram" aria-hidden="true">w5y</div>
        <h1>Good things,<br />made simply.</h1>
        <p>A small and growing collection of apps from w5y.</p>
      </header>

      <nav class="links" aria-label="Apps and links">
        <a
          class="app-link"
          href="https://apps.apple.com/gb/app/frameweave/id6785077350"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Frameweave — create beautiful social carousels. Open on the App Store."
        >
          <img
            class="app-icon"
            src="assets/frameweave-app-icon.png"
            alt="Frameweave app icon"
            width="72"
            height="72"
          />
          <span class="app-copy">
            <h2>Frameweave</h2>
            <p>Create beautiful social carousels</p>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>

      <footer>© 2026 w5y</footer>
    </main>
  </body>
</html>
